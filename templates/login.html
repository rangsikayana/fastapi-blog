{% extends "layout.html" %}
{% block content %}
    <div class="content-section py-3 px-4 mb-4">
        <h2 class="mb-4">Login</h2>
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <!-- OAuth2PasswordRequestForm expects 'username' field, but used for 'email' -->
                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="username"
                    required
                />
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    required
                />
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <p class="mt-3">
            Don't have an account?
            <a href="{{ url_for("register_page") }}">Register here</a>
        </p>
    </div>
{% endblock content %}
{% block scripts %}
    <script type="module">
        import { getErrorMessage, showModal } from "/static/js/utils.js";

        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const formData = new FormData(loginForm);

            try {
                const response = await fetch("/api/users/token", {
                    method: "POST",
                    body: formData, // OAuth2PasswordRequestForm expects 'application/x-www-form-urlencoded' or 'multipart/form-data'
                }); // fetch() auto-generates 'Content-Type: multipart/form-data' with boundary when passed a FormData() obj

                if (response.ok) {
                    const data = await response.json();

                    // Stores token in localStorage because it works with all client types (e.g. web, mobile, etc.)
                    // NOTE: It's vulnarable to cross-site scripting attacks
                    // Prevent with short token exp, HTTP only cookie (for browser apps)
                    localStorage.setItem("access_token", data.access_token);

                    // Shows success modal & redirects to home
                    document.getElementById("successMessage").textContent =
                        "Login successful!";
                    showModal("successModal");

                    document.getElementById("successModal").addEventListener(
                        "hidden.bs.modal",
                        () => {
                            window.location.href = "/";
                        },
                        { once: true },
                    );
                } else {
                    const error = await response.json();
                    document.getElementById("errorMessage").textContent =
                        getErrorMessage(error);
                    showModal("errorModal");
                }
            } catch (error) {
                document.getElementById("errorMessage").textContent =
                    "Network error. Please check your connection and try again.";
                showModal("errorModal");
            }
        });
    </script>
{% endblock scripts %}
